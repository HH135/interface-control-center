services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: icc
      POSTGRES_USER: icc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-icc_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icc -d icc"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/icc
      DB_USERNAME: icc
      DB_PASSWORD: ${DB_PASSWORD:-icc_local}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
