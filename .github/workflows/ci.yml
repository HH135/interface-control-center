name: Build and integration test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: icc_test
          POSTGRES_USER: icc
          POSTGRES_PASSWORD: icc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U icc -d icc_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/icc_test
      TEST_DB_USERNAME: icc
      TEST_DB_PASSWORD: icc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/test
      - run: docker compose config --quiet
      - run: docker build -t icc:ci .
